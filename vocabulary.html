<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TOEIC Vocabulary</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f7fa;
    margin:0;
}

header{

  background:
  linear-gradient(
    135deg,
    #2563eb,
    #0ea5e9
  );

  color:white;

  padding:30px;

}

.container{
    width:90%;
    max-width:1000px;
    margin:auto;
    padding:20px;
}
#wordContainer{

    display:grid;

    grid-template-columns:
    repeat(
      auto-fit,
      minmax(280px,1fr)
    );

    gap:20px;

}
.card{

    background:white;

    padding:20px;

    border-radius:15px;

    box-shadow:
    0 5px 15px rgba(
      0,0,0,0.1
    );

    transition:.3s;

}

.card:hover{

    transform:
    translateY(-5px);

}


.word{

    font-size:30px;

    color:#2563eb;

    font-weight:bold;

    margin-bottom:10px;

}

.meaning{

    font-size:18px;

    color:#334155;

    margin-bottom:10px;

}

.example{

    color:#64748b;

    font-size:15px;

    line-height:1.5;

}

button{
    margin-top:15px;
    padding:10px 15px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.speak{
    background:#3b82f6;
    color:white;
}

.favorite{
    background:#f59e0b;
    color:white;
}

.search{
    width:100%;
    padding:10px;
    margin-bottom:20px;
}

</style>
</head>

<body>

header

<h1>📚 TOEIC Vocabulary Center</h1>

<p>
index.html返回首頁</a>
</p>

</header>

<div class="container">

<input
type="text"
id="search"
class="search"
placeholder="搜尋單字...">

<div id="wordContainer"></div>

</div>

<script>

function speak(word){

    let msg =
    new SpeechSynthesisUtterance(word);

    msg.lang="en-US";

    speechSynthesis.speak(msg);
}

function addFavorite(word){

    let favorites =
    JSON.parse(
      localStorage.getItem("favorites")
    ) || [];

    if(!favorites.includes(word)){

        favorites.push(word);

        localStorage.setItem(
            "favorites",
            JSON.stringify(favorites)
        );

        alert(word + " 已收藏");
    }
}

async function loadWords(){

    try{

        const response =
        await fetch(
            "data/toeic-3000.json"
        );

        const words =
        await response.json();

        let html="";

       words.forEach(word=>{

    html += `

    <div class="card">

        <div class="level">
            TOEIC ${word.level}
        </div>

        <div class="word">
            ${word.word}
        </div>

        <div class="part">
            ${word.part}
        </div>

        <div class="meaning">
            ${word.meaning}
        </div>

        <div class="example">
            ${word.example || ""}
        </div>

        <button
        class="speak"
        onclick="speak('${word.word}')">

        🔊 發音

        </button>

        <button
        class="favorite"
        onclick="addFavorite('${word.word}')">

        ⭐ 收藏

        </button>

    </div>

    `;

});

        document
        .getElementById("wordContainer")
        .innerHTML = html;

    }
    catch(error){

        document
        .getElementById("wordContainer")
        .innerHTML =
        "<h2>無法讀取單字資料庫</h2>";

        console.error(error);
    }
}

loadWords();

</script>

</body>
</html>
